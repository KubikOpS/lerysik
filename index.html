<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Для Леры ♥</title>
<style>
:root{color-scheme:dark;--bg:#05030c;--fg:#ffe9f1;--accent:#ff4d8d}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fx{pointer-events:none}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);color:var(--fg);opacity:0;transition:opacity 1s;font-size:16px;letter-spacing:.04em;pointer-events:none}
#hint.on{opacity:.85;animation:pulse 1.8s infinite}
.btn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;pointer-events:none;transition:opacity .8s,left .3s ease-out,top .3s ease-out;background:rgba(255,77,141,.18);border:1px solid var(--accent);border-radius:999px;padding:12px 24px;font:inherit;font-size:16px;color:var(--fg);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn.on{opacity:1;pointer-events:auto}
#again{top:calc(env(safe-area-inset-top,0px) + 26px);left:auto;right:14px;transform:translateY(-50%);padding:8px 16px;font-size:14px}
#no{background:rgba(120,120,140,.16);border-color:#8b95a8}
.fl{position:fixed;pointer-events:none;font-size:22px;color:#ff6fa5;animation:fly 2.2s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-55vh) scale(1.5);opacity:0}}
@keyframes pulse{50%{opacity:.35}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="fx"></canvas>
<div id="hint">коснись сердца ✨</div>
<button id="again" class="btn" type="button">ещё раз ↻</button>
<button id="ok" class="btn" type="button"></button>
<button id="no" class="btn" type="button"></button>
<script>
(() => {
  'use strict';

  // 10-11 в палитре: серо-синие, цвет кода
  const HEX = ['#ff3d7f', '#ff9ec4', '#ffffff', '#ffe27a', '#ffb347', '#4aa8ff', '#a06bff', '#ff5fc2', '#ffd34d', '#36e0d0', '#8b95a8', '#5d6b86', '#ff2a2a'];
  const PALF = new Float32Array(HEX.flatMap((h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16) / 255)));
  const ARMS = [5, 6, 7, 8];
  const WALL = [5, 6, 9, 10, 10, 11, 11, 8];
  const CODE = `def galaxy_pos(t): if t < T_RE: P, u = explosion_pos(t) return P, u, np.ones(NP, bool), np.linalg.norm(P, axis=1)
    _re_state() v = t - T_RE ue = v - 0.6 * (1 - math.exp(-v / 0.6)) r = np.sqrt(np.maximum(D_RE ** 2 - K_RE * ue, 0))
    ang = A_RE + 0.5 * v + 0.6 * (4 / K_RE) * (np.sqrt(D_RE) - np.sqrt(r)) P = (r * np.cos(ang))[:, None] * E1 + (r * np.sin(ang))[:, None] * E2
    alive = t < T_EATP return P, _U_RE + v, alive, r hsx, hsy, hz = project(np.zeros((1, 3)), cam) rhs = F * rh / hz`;
  const CODE_CHARS = Array.from(CODE.replace(/\s/g, ''));
  const CH = Array.from(new Set(CODE_CHARS.concat(Array.from('ЛЕРАТЫУЧШЯЮБОВИ♥'))));
  const CHI = new Map(CH.map((c, i) => [c, i]));
  const CELL = 40;
  const HOLE_T = 5.5, GAL_T = 5.5;

  // тексты
  const TXT = {
    heart: ['Лера,', 'ты лучшая'],
    final: ['Я тебя люблю'],
    finalPortrait: ['Я тебя', 'люблю'],
    sub: 'не игнорь меня больше',
    ok: 'не буду игнорить ❤️',
    okDone: 'договорились 🫶',
    no: 'буду игнорить тебе назло 😈',
    angry: 'вот зараза мелкая',
  };

  const cv = document.getElementById('c');
  const fx = document.getElementById('fx');
  const fctx = fx.getContext('2d');
  const hintEl = document.getElementById('hint');
  const againEl = document.getElementById('again');
  const okEl = document.getElementById('ok');
  const noEl = document.getElementById('no');
  const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  if (!gl) { document.body.textContent = 'Нужен WebGL — открой в Chrome или Safari'; return; }
  // контекст потерян: перезагрузка
  cv.addEventListener('webglcontextlost', (e) => e.preventDefault());
  cv.addEventListener('webglcontextrestored', () => location.reload());

  function prog(vs, fs) {
    const mk = (t, s) => {
      const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o));
      return o;
    };
    const p = gl.createProgram();
    gl.attachShader(p, mk(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }
  let pP, pF;
  try {
    pP = prog(`attribute vec3 aP; attribute vec2 aS;
      uniform vec2 uRes, uC; uniform float uZ, uDpr, uN; uniform vec3 uPal[13];
      varying vec3 vCol; varying float vOff, vW;
      void main(){
        vec2 p = (aP.xy - uC) * uZ + uC;
        gl_Position = vec4(p.x / uRes.x * 2.0 - 1.0, 1.0 - p.y / uRes.y * 2.0, 0.0, 1.0);
        gl_PointSize = aS.x * uZ * uDpr;
        vCol = uPal[int(aP.z + 0.5)]; vOff = aS.y / uN; vW = 1.0 / uN;
      }`,
    `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uT; uniform float uA; varying vec3 vCol; varying float vOff, vW;
      void main(){
        float a = texture2D(uT, vec2(vOff + gl_PointCoord.x * vW, gl_PointCoord.y)).a;
        gl_FragColor = vec4(vCol, a * uA);
      }`);
    pF = prog(`attribute vec2 aQ; void main(){ gl_Position = vec4(aQ, 0.0, 1.0); }`,
      `precision mediump float; uniform float uF; void main(){ gl_FragColor = vec4(0.02, 0.012, 0.05, uF); }`);
  } catch (e) { document.body.textContent = 'Ошибка шейдера: ' + e.message; return; }

  const L = {
    aP: gl.getAttribLocation(pP, 'aP'), aS: gl.getAttribLocation(pP, 'aS'), aQ: gl.getAttribLocation(pF, 'aQ'),
    uRes: gl.getUniformLocation(pP, 'uRes'), uC: gl.getUniformLocation(pP, 'uC'), uZ: gl.getUniformLocation(pP, 'uZ'),
    uDpr: gl.getUniformLocation(pP, 'uDpr'), uPal: gl.getUniformLocation(pP, 'uPal'), uT: gl.getUniformLocation(pP, 'uT'),
    uA: gl.getUniformLocation(pP, 'uA'), uN: gl.getUniformLocation(pP, 'uN'), uF: gl.getUniformLocation(pF, 'uF'),
  };
  const bufDyn = gl.createBuffer(), bufStat = gl.createBuffer(), bufQuad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bufQuad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

  const atlas = document.createElement('canvas');
  atlas.width = CELL * CH.length; atlas.height = CELL;
  const actx = atlas.getContext('2d');
  actx.font = 'bold 34px "Courier New", monospace';
  actx.textAlign = 'center'; actx.textBaseline = 'middle'; actx.fillStyle = '#fff';
  CH.forEach((ch, i) => actx.fillText(ch, i * CELL + CELL / 2, CELL / 2 + 1));
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);

  const oc = document.createElement('canvas');
  const octx = oc.getContext('2d', { willReadFrequently: true });

  let W = 0, H = 0, DPR = 1, N = 0, lastW = 0, lastH = 0;
  let X, Y, VX, VY, WX, WY, HX, HY, FX, FY, HRL, FRL, CC, COL, ARM, A, G, J, RR, HRR, DL, POS, STAT, LX, LY, LR, AX, AY, AR;
  let stage = 'chaos', stageT = 0, runT = 0, HR = 30, zoom = 3, mood = 'love';
  let down = null, emaDt = 0.016, frames = 0, calibrated = false;
  const ptr = { x: -9999, y: -9999 };

  const sm = (t) => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * t * (t * (t * 6 - 15) + 10); };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function fitSize(c, text, maxW, cap, weight) {
    c.font = `${weight} 100px system-ui, "Segoe UI", Roboto, sans-serif`;
    return Math.min(cap, (maxW / c.measureText(text).width) * 100);
  }

  function sampleLayers(layers) {
    const masks = layers.map((l) => {
      octx.clearRect(0, 0, W, H);
      octx.globalCompositeOperation = 'source-over';
      octx.fillStyle = octx.strokeStyle = '#fff';
      l.draw(octx);
      return octx.getImageData(0, 0, W, H).data;
    });
    const cnt = masks.map((d) => { let c = 0; for (let i = 3; i < d.length; i += 4) if (d[i] > 140) c++; return c; });
    let s = 1;
    for (; s < 24; s += 0.25) {
      let tot = 0;
      layers.forEach((l, i) => { const st = Math.max(1.5, s * l.mult); tot += cnt[i] / (st * st); });
      if (tot <= N) break;
    }
    const out = [];
    layers.forEach((l, i) => {
      const st = Math.max(1.5, s * l.mult), d = masks[i];
      for (let y = 0; y < H; y += st) for (let x = 0; x < W; x += st) {
        const xi = x | 0, yi = y | 0;
        if (d[(yi * W + xi) * 4 + 3] > 140) out.push(xi, yi, l.role);
      }
    });
    return out;
  }

  function heartLayers() {
    const size = Math.min(W * 0.9, H * 0.56), s = size / 34, cx = W / 2, cy = H * 0.44;
    const path = (c) => {
      c.beginPath();
      for (let i = 0; i <= 200; i++) {
        const t = (i / 200) * Math.PI * 2;
        const x = 16 * Math.sin(t) ** 3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        const px = cx + x * s, py = cy - (y + 2.5) * s;
        if (i) c.lineTo(px, py); else c.moveTo(px, py);
      }
      c.closePath();
    };
    const text = (c, carve) => {
      const fs = fitSize(c, TXT.heart.reduce((a, b) => (a.length >= b.length ? a : b)), size * 0.66, size * 0.26, 900);
      c.font = `900 ${fs}px system-ui, "Segoe UI", Roboto, sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const y1 = cy - fs * 0.62 - size * 0.03, y2 = cy + fs * 0.62 - size * 0.03;
      if (carve) {
        c.globalCompositeOperation = 'destination-out';
        c.lineWidth = fs * 0.3; c.lineJoin = 'round';
        c.strokeText(TXT.heart[0], cx, y1); c.strokeText(TXT.heart[1], cx, y2);
      }
      c.fillText(TXT.heart[0], cx, y1); c.fillText(TXT.heart[1], cx, y2);
      c.globalCompositeOperation = 'source-over';
    };
    return [
      { draw: (c) => { path(c); c.fill(); text(c, true); }, role: 0, mult: 2.6 },
      { draw: (c) => { path(c); c.lineWidth = size * 0.04; c.stroke(); }, role: 1, mult: 1.1 },
      { draw: (c) => text(c, false), role: 2, mult: 0.8 },
    ];
  }

  function finalLayers() {
    const portrait = W < H * 0.9, cx = W / 2;
    const lines = portrait ? TXT.finalPortrait : TXT.final;
    const sub = TXT.sub;
    const main = (c) => {
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const fs = Math.min(...lines.map((l) => fitSize(c, l, W * 0.86, portrait ? W * 0.3 : H * 0.22, 900)));
      c.font = `900 ${fs}px system-ui, "Segoe UI", Roboto, sans-serif`;
      lines.forEach((l, i) => c.fillText(l, cx, H * 0.38 + (i - (lines.length - 1) / 2) * fs * 1.1));
    };
    const bottom = (c) => {
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const fs = fitSize(c, sub, W * 0.88, 52, 800);
      c.font = `800 ${fs}px system-ui, "Segoe UI", Roboto, sans-serif`;
      c.fillText(sub, cx, H * 0.74);
    };
    return [{ draw: main, role: 1, mult: 1 }, { draw: bottom, role: 3, mult: 0.8 }];
  }

  function angryLayers() {
    const cx = W / 2, cy = H * 0.37, r = Math.min(W * 0.36, H * 0.2);
    const disc = (c) => { c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); };
    const face = (c) => {
      disc(c); c.fill();
      c.globalCompositeOperation = 'destination-out';
      c.lineCap = 'round'; c.lineWidth = r * 0.12;
      for (const s of [-1, 1]) {
        c.beginPath(); c.moveTo(cx + s * r * 0.62, cy - r * 0.42); c.lineTo(cx + s * r * 0.15, cy - r * 0.18); c.stroke();
        c.beginPath(); c.arc(cx + s * r * 0.34, cy + r * 0.04, r * 0.1, 0, Math.PI * 2); c.fill();
      }
      c.lineWidth = r * 0.1;
      c.beginPath(); c.arc(cx, cy + r * 0.72, r * 0.36, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
      c.globalCompositeOperation = 'source-over';
    };
    const sub = (c) => {
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const fs = fitSize(c, TXT.angry, W * 0.88, 52, 800);
      c.font = `800 ${fs}px system-ui, "Segoe UI", Roboto, sans-serif`;
      c.fillText(TXT.angry, cx, H * 0.74);
    };
    return [
      { draw: face, role: 12, mult: 1.2 },
      { draw: (c) => { disc(c); c.lineWidth = r * 0.07; c.stroke(); }, role: 4, mult: 1 },
      { draw: sub, role: 3, mult: 0.8 },
    ];
  }

  function assign(out, tx, ty, tr) {
    const n = out.length / 3;
    if (!n) return;
    const perm = new Uint32Array(n);
    for (let i = 0; i < n; i++) perm[i] = i;
    for (let i = n - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
    for (let i = 0; i < N; i++) {
      const k = perm[i % n] * 3, dup = i >= n;
      tx[i] = out[k] + (dup ? (Math.random() - 0.5) * 2.5 : 0);
      ty[i] = out[k + 1] + (dup ? (Math.random() - 0.5) * 2.5 : 0);
      tr[i] = out[k + 2];
    }
  }

  function buildTargets() {
    try {
      assign(sampleLayers(heartLayers()), HX, HY, HRL);
      assign(sampleLayers(finalLayers()), LX, LY, LR);
      assign(sampleLayers(angryLayers()), AX, AY, AR);
      setMood(mood, true);
    } catch (e) { console.error('Ошибка построения целей:', e); }
  }

  function initParticles(n) {
    N = n;
    const f = () => new Float32Array(n), u = () => new Uint8Array(n);
    X = f(); Y = f(); VX = f(); VY = f(); WX = f(); WY = f(); HX = f(); HY = f(); FX = f(); FY = f();
    A = f(); G = f(); J = f(); RR = f(); HRR = f(); DL = f(); LX = f(); LY = f(); AX = f(); AY = f();
    HRL = u(); FRL = u(); CC = u(); COL = u(); ARM = u(); LR = u(); AR = u();
    POS = new Float32Array(n * 3); STAT = new Float32Array(n * 2);
    const sz = clamp(Math.sqrt((W * H) / n) * 1.35, 3, 8);
    const cols = Math.ceil(Math.sqrt((n * W) / H)), rows = Math.ceil(n / cols);
    const cw = W / cols, rh = H / rows;
    for (let i = 0; i < n; i++) {
      WX[i] = X[i] = (i % cols) * cw + cw / 2; WY[i] = Y[i] = ((i / cols) | 0) * rh + rh / 2;
      COL[i] = WALL[(Math.random() * WALL.length) | 0]; CC[i] = COL[i];
      A[i] = Math.random() * 6.2832; ARM[i] = i % 4; G[i] = Math.sqrt(Math.random()); J[i] = Math.random() - 0.5;
      STAT[i * 2] = sz * (0.85 + Math.random() * 0.35);
      STAT[i * 2 + 1] = CHI.get(CODE_CHARS[i % CODE_CHARS.length]);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, bufStat); gl.bufferData(gl.ARRAY_BUFFER, STAT, gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufDyn); gl.bufferData(gl.ARRAY_BUFFER, POS.byteLength, gl.DYNAMIC_DRAW);
  }

  function rebuild(n) { initParticles(n); buildTargets(); setStage('chaos', true); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, Math.floor(innerWidth)); H = Math.max(1, Math.floor(innerHeight));
    cv.width = fx.width = Math.round(W * DPR); cv.height = fx.height = Math.round(H * DPR);
    oc.width = W; oc.height = H;
    HR = Math.min(W, H) * 0.085;
    const first = !N;
    const bigChange = first || W !== lastW || Math.abs(H - lastH) > H * 0.12;
    lastW = W; lastH = H;
    if (bigChange) rebuild(clamp(Math.round((W * H) / 22), 25000, 80000));
  }

  function setStage(s, keepFade) {
    stage = s; stageT = 0;
    if (s === 'chaos' && !keepFade) runT = 1.2;
    const CX = W / 2, CY = H / 2, hcy = H * 0.44;
    if (s === 'chaos') {
      for (let i = 0; i < N; i++) { VX[i] = VY[i] = 0; if (keepFade) { X[i] = WX[i]; Y[i] = WY[i]; CC[i] = COL[i]; } }
    } else if (s === 'heart') {
      const m = Math.min(W, H) * 0.5;
      for (let i = 0; i < N; i++) DL[i] = clamp(Math.hypot(HX[i] - CX, HY[i] - hcy) / m, 0, 1) * 0.6 + Math.random() * 0.4;
    } else if (s === 'hole') {
      for (let i = 0; i < N; i++) {
        A[i] = Math.atan2(Y[i] - CY, X[i] - CX); RR[i] = Math.hypot(X[i] - CX, Y[i] - CY);
        HRR[i] = HR * (1 + Math.random() * 1.8);
      }
    } else if (s === 'galaxy') {
      const sp = Math.max(W, H);
      for (let i = 0; i < N; i++) {
        const ang = Math.atan2(Y[i] - CY, X[i] - CX) + (Math.random() - 0.5) * 0.4, v = 100 + Math.random() * sp * 0.8;
        VX[i] = Math.cos(ang) * v; VY[i] = Math.sin(ang) * v; CC[i] = ARMS[ARM[i]];
      }
    } else if (s === 'final') {
      for (let i = 0; i < N; i++) DL[i] = Math.random() * 0.6 + clamp(Math.hypot(FX[i] - CX, FY[i] - CY) / Math.max(W, H), 0, 1) * 0.4;
    }
    hintEl.classList.remove('on');
    againEl.classList.remove('on');
    okEl.classList.remove('on');
    noEl.classList.remove('on');
    resetBtns();
  }

  function zoomTarget(hu) {
    if (stage === 'chaos') return 3 - 0.35 * sm(stageT / 3.4);
    if (stage === 'heart') return 1 + 1.65 * (1 - sm(stageT / 6));
    if (stage === 'hole') return 1 + 0.8 * sm(hu);
    if (stage === 'galaxy') return 1.8 - 0.95 * sm(stageT / GAL_T);
    return 0.85 + 0.15 * sm(stageT / 2.5);
  }

  let gx = 0, gy = 0;
  function galaxyPos(i, t, CX, CY, Rmax) {
    const q = G[i] * Rmax;
    const ang = (ARM[i] * Math.PI) / 2 + G[i] * 4.4 + t * (0.5 + 1.2 * (1 - G[i])) + J[i] * 0.5;
    gx = CX + Math.cos(ang) * q; gy = CY + Math.sin(ang) * q * 0.62;
  }

  function step(dt) {
    stageT += dt; runT += dt;
    if (stage === 'chaos' && stageT > 3.4) setStage('heart');
    else if (stage === 'hole' && stageT > HOLE_T) setStage('galaxy');
    else if (stage === 'galaxy' && stageT > GAL_T) setStage('final');
    hintEl.classList.toggle('on', stage === 'heart' && stageT > 6);
    const fin = stage === 'final' && stageT > 4.5;
    againEl.classList.toggle('on', fin);
    okEl.classList.toggle('on', fin);
    noEl.classList.toggle('on', fin && !agreed && mood === 'love');

    const CX = W / 2, CY = H / 2, hcy = H * 0.44;
    const hu = Math.min(stageT / HOLE_T, 1);
    zoom += (zoomTarget(hu) - zoom) * Math.min(1, dt * 3.5);
    const px = CX + (ptr.x - CX) / zoom, py = CY + (ptr.y - CY) / zoom;
    const rad = Math.max(55, Math.min(W, H) * 0.14) / zoom, rad2 = rad * rad;
    const repel = stage === 'heart' || stage === 'final';
    const beat = stage === 'heart' ? 1 + 0.012 * sm((stageT - 5) / 2) * Math.sin(stageT * 4) : 1;
    const Rmax = Math.min(W, H) * 0.5;
    const hw = sm(stageT / 1.8);
    let K = 40, D = 11;
    if (stage === 'chaos') { K = 12; D = 6; }
    else if (stage === 'hole') { K = 90; D = 19; }
    else if (stage === 'galaxy') { K = 6; D = 3.4; }
    const fr = Math.exp(-D * dt);

    for (let i = 0; i < N; i++) {
      let tx, ty;
      if (stage === 'chaos') {
        tx = WX[i] + Math.sin(stageT * 1.3 + A[i]) * 1.2; ty = WY[i] + Math.cos(stageT * 1.1 + A[i]) * 1.2;
      } else if (stage === 'heart') {
        const b = sm((stageT - DL[i] * 2.4) / 2.6);
        tx = WX[i] + (CX + (HX[i] - CX) * beat - WX[i]) * b; ty = WY[i] + (hcy + (HY[i] - hcy) * beat - WY[i]) * b;
        if (b > 0.4) CC[i] = HRL[i];
      } else if (stage === 'hole') {
        RR[i] = Math.max(HRR[i], RR[i] * Math.exp(-dt * (0.12 + (0.5 + hu * 3) * hw)));
        A[i] += dt * hw * (0.5 + 110 / (RR[i] + 30));
        tx = CX + Math.cos(A[i]) * RR[i]; ty = CY + Math.sin(A[i]) * RR[i];
        if (RR[i] < HR * 2.4) CC[i] = i & 1 ? 4 : 3;
      } else if (stage === 'galaxy') {
        galaxyPos(i, stageT, CX, CY, Rmax); tx = gx; ty = gy;
      } else {
        galaxyPos(i, GAL_T + stageT, CX, CY, Rmax);
        const b = sm((stageT - DL[i] * 1.6) / 2.4);
        tx = gx + (FX[i] + Math.sin(stageT * 2 + A[i]) * 0.4 - gx) * b; ty = gy + (FY[i] - gy) * b;
        if (b > 0.4) CC[i] = FRL[i];
      }
      let vx = VX[i] + (tx - X[i]) * K * dt, vy = VY[i] + (ty - Y[i]) * K * dt;
      if (repel) {
        const dx = X[i] - px, dy = Y[i] - py, d2 = dx * dx + dy * dy;
        if (d2 < rad2 && d2 > 0.01) {
          const d = Math.sqrt(d2), f = 1 - d / rad;
          vx += (dx / d) * f * f * 16000 * dt; vy += (dy / d) * f * f * 16000 * dt;
        }
      }
      vx *= fr; vy *= fr;
      VX[i] = vx; VY[i] = vy;
      const x = (X[i] += vx * dt), y = (Y[i] += vy * dt), k = i * 3;
      POS[k] = x; POS[k + 1] = y; POS[k + 2] = CC[i];
    }
  }

  function render(dt) {
    gl.viewport(0, 0, cv.width, cv.height);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(pF);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufQuad);
    gl.enableVertexAttribArray(L.aQ); gl.vertexAttribPointer(L.aQ, 2, gl.FLOAT, false, 0, 0);
    gl.uniform1f(L.uF, stage === 'hole' || stage === 'galaxy' ? 0.3 : 1); // шлейф только в движении
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(L.aQ);
    gl.useProgram(pP);
    gl.blendFunc(gl.SRC_ALPHA, stage === 'hole' || stage === 'galaxy' ? gl.ONE : gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufDyn); gl.bufferSubData(gl.ARRAY_BUFFER, 0, POS);
    gl.enableVertexAttribArray(L.aP); gl.vertexAttribPointer(L.aP, 3, gl.FLOAT, false, 12, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, bufStat);
    gl.enableVertexAttribArray(L.aS); gl.vertexAttribPointer(L.aS, 2, gl.FLOAT, false, 8, 0);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(L.uT, 0); gl.uniform1f(L.uN, CH.length);
    gl.uniform2f(L.uRes, W, H); gl.uniform2f(L.uC, W / 2, H / 2);
    gl.uniform1f(L.uZ, zoom); gl.uniform1f(L.uDpr, DPR);
    gl.uniform1f(L.uA, sm(runT / 2) * (stage === 'hole' || stage === 'galaxy' ? 0.8 : 1));
    gl.uniform3fv(L.uPal, PALF);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.disableVertexAttribArray(L.aP); gl.disableVertexAttribArray(L.aS);
    drawFx();
  }

  let fxDirty = false;
  function drawFx() {
    const on = stage === 'hole' || (stage === 'galaxy' && stageT < 3);
    if (!on && !fxDirty) return;
    const CX = W / 2, CY = H / 2;
    fctx.setTransform(1, 0, 0, 1, 0, 0);
    fctx.clearRect(0, 0, fx.width, fx.height);
    fxDirty = on;
    if (!on) return;
    fctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, DPR * CX * (1 - zoom), DPR * CY * (1 - zoom));
    let r = HR, alpha = 1;
    if (stage === 'hole') { r = HR * (0.2 + 0.8 * sm(stageT / 2.5)); alpha = sm(stageT / 1.5); }
    else alpha = 1 - sm(stageT / 3);
    fctx.globalAlpha = alpha;
    fctx.fillStyle = '#000';
    fctx.beginPath(); fctx.arc(CX, CY, r, 0, Math.PI * 2); fctx.fill();
    fctx.strokeStyle = 'rgba(255,200,110,.9)'; fctx.lineWidth = 2.5 / zoom;
    fctx.shadowColor = '#ff9a3c'; fctx.shadowBlur = 26;
    fctx.beginPath(); fctx.arc(CX, CY, r * 1.1, 0, Math.PI * 2); fctx.stroke();
    fctx.shadowBlur = 0;
    if (stage === 'galaxy' && stageT < 1.1) {
      fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      fctx.globalAlpha = (1 - sm(stageT / 1.1)) * 0.35;
      fctx.fillStyle = '#fff0dc'; fctx.fillRect(0, 0, W, H);
    }
    fctx.globalAlpha = 1;
  }

  let agreed = false;
  function setMood(m, silent) {
    mood = m;
    const s = m === 'angry' ? [AX, AY, AR] : [LX, LY, LR];
    FX.set(s[0]); FY.set(s[1]); FRL.set(s[2]);
    if (silent) return;
    for (let i = 0; i < N; i++) { VX[i] += (Math.random() - 0.5) * 1200; VY[i] += (Math.random() - 0.5) * 1200; }
  }
  function placeBtn(el, x, y) { el.style.left = x + 'px'; el.style.top = y + 'px'; }
  function resetBtns() {
    agreed = false;
    setMood('love', true);
    okEl.textContent = TXT.ok; noEl.textContent = TXT.no;
    placeBtn(okEl, W / 2, H * 0.82);
    placeBtn(noEl, W / 2, H * 0.82 + 58);
  }
  function burst() {
    const r = okEl.getBoundingClientRect();
    for (let k = 0; k < 18; k++) {
      const s = document.createElement('span');
      s.className = 'fl'; s.textContent = '♥';
      s.style.left = r.left + Math.random() * r.width + 'px'; s.style.top = r.top + 'px';
      s.style.setProperty('--dx', (Math.random() - 0.5) * 160 + 'px');
      s.style.animationDuration = 1.6 + Math.random() * 1.2 + 's';
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 3000);
    }
  }
  noEl.addEventListener('click', () => { if (!agreed) setMood('angry'); });
  okEl.addEventListener('click', () => { if (agreed) return; agreed = true; setMood('love'); okEl.textContent = TXT.okDone; burst(); });

  let last = performance.now();
  function frame(now) {
    const raw = (now - last) / 1000;
    const dt = Math.min(0.033, raw);
    last = now;
    emaDt += (raw - emaDt) * 0.08;
    try { step(dt); render(dt); } catch (e) { console.error('Ошибка кадра:', e); }
    // слабое устройство: один раз уменьшаем число частиц
    if (!calibrated && ++frames === 45) {
      calibrated = true;
      if (emaDt > 0.026 && N > 14000 && stage === 'chaos') rebuild(Math.floor(N * 0.55));
    }
    requestAnimationFrame(frame);
  }

  function onTap() {
    if (stage === 'chaos') setStage('heart');
    else if (stage === 'heart' && stageT > 2.5) setStage('hole');
  }

  cv.addEventListener('pointerdown', (e) => {
    ptr.x = e.clientX; ptr.y = e.clientY;
    down = { t: performance.now(), x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointermove', (e) => { ptr.x = e.clientX; ptr.y = e.clientY; });
  cv.addEventListener('pointerup', (e) => {
    if (down && performance.now() - down.t < 350 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 14) onTap();
    down = null;
    if (e.pointerType !== 'mouse') ptr.x = ptr.y = -9999;
  });
  cv.addEventListener('pointercancel', () => { down = null; ptr.x = ptr.y = -9999; });
  cv.addEventListener('pointerleave', () => { ptr.x = ptr.y = -9999; });
  againEl.addEventListener('click', () => { runT = 3; setStage('chaos', true); zoom = 1; });

  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 200); });

  resize();
  gl.clearColor(0.02, 0.012, 0.05, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
